apiVersion: backstage.io/v1alpha1
kind: Domain
metadata:
  name: demo
  title: Demo
  description: Demonstration domain for event-driven business systems and
    contract-first API development.
  annotations:
    contract-first-idp.github.io/scm-provider: github
    contract-first-idp.github.io/scm-host: github.com
    contract-first-idp.github.io/domain-org: contract-first-kafka
    contract-first-idp.github.io/domain-repo: demo-domain
  links:
    - url: https://github.com/contract-first-kafka/demo-domain
      title: Domain repository
      icon: github
spec:
  owner: group:default/domain-maintainers
  platformTarget: resource:default/workshop
  groupId: io.github.contractfirstkafka.demo
  eventCatalog:
    enabled: true
    image: registry-quay-quay.apps.cluster-ggvsm.dyn.redhatworkshops.io/openshift_demo-catalog/eventcatalog@sha256:31b6b8d2204a8f265f1ddfd5fd86c69e1598abfecfd39cee84e14b54d77aea38
    inputDigest: d151246defbd0800e0ed570bb79667730110f00162cdc62b6ecd4287f812311e
  environments:
    order:
      - dev
      - test
      - prod
    build: dev
    definitions:
      dev:
        namespaceSuffix: -dev
      test:
        namespaceSuffix: -test
      prod:
        namespaceSuffix: ""
